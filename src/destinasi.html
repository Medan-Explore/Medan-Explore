<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destinasi Wisata - Medan Explore</title>
    <link rel="icon" type="image/png" href="./images/logo-kita.png" />
    <meta
      name="description"
      content="Daftar destinasi wisata Medan Explore: wisata sejarah, alam, dan rekreasi di Kota Medan."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Figtree:wght@400;500;600&family=Noto+Naskh+Arabic&family=Noto+Sans+Batak&family=Noto+Sans+Tamil&display=swap"
      rel="stylesheet"
    />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="bg-[#FDFBF7] text-gray-800 font-sans">
    <!-- NAVBAR -->
    <header
      id="navbar"
      class="dark-zone group fixed inset-x-0 top-0 z-50 border-b border-green-950/15 bg-amber-50"
    >
      <nav
        class="mx-auto flex h-16 w-full max-w-xxl items-center justify-between px-6"
        aria-label="Navigasi utama"
      >
        <a
          href="index.html"
          class="flex items-center gap-2.5 font-display text-xl font-bold text-green-950 group-data-open:text-yellow-500"
        >
          Medan Explore
        </a>

        <ul
          id="menu"
          class="fixed inset-0 -z-10 flex translate-x-full flex-col bg-green-950 px-6 pt-24 font-display text-4xl font-bold text-amber-50 transition-transform duration-300 md:static md:z-auto md:translate-x-0 md:flex-row md:items-center md:gap-8 md:bg-transparent md:p-0 md:text-base md:font-medium md:text-stone-900 md:transition-none"
        >
          <li>
            <a
              href="index.html"
              class="block py-3 md:py-1 md:underline-offset-8 md:hover:underline md:decoration-2 md:decoration-yellow-600"
              >Home</a
            >
          </li>
          <li>
            <a
              href="destinasi.html"
              class="block py-3 md:py-1 md:underline-offset-8 md:hover:underline md:decoration-2 md:decoration-yellow-600"
              >Destinasi</a
            >
          </li>
          <li>
            <a
              href="kuliner.html"
              class="block py-3 md:py-1 md:underline-offset-8 md:hover:underline md:decoration-2 md:decoration-yellow-600"
              >Kuliner</a
            >
          </li>
          <li>
            <a
              href="gallery.html"
              class="block py-3 md:py-1 md:underline-offset-8 md:hover:underline md:decoration-2 md:decoration-yellow-600"
              >Gallery</a
            >
          </li>
          <li>
            <a
              href="contact.html"
              class="block py-3 md:py-1 md:underline-offset-8 md:hover:underline md:decoration-2 md:decoration-yellow-600"
              >Contact</a
            >
          </li>
        </ul>

        <button
          id="menu-btn"
          type="button"
          class="-mr-2 grid size-11 place-items-center group-data-open:text-amber-50 md:hidden"
          aria-label="Buka menu"
          aria-expanded="false"
          aria-controls="menu"
        >
          <svg
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path id="icon-open" d="M4 7h16M4 12h16M4 17h16" />
            <path id="icon-close" class="hidden" d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </nav>
    </header>

    <!-- HEADER SECTION -->
    <section class="bg-[#0b2416] text-white pt-28 pb-12 px-6 text-center">
      <h1 class="text-4xl font-bold mb-3 text-[#f2c94c]">
        Jelajahi Destinasi Wisata Medan
      </h1>
      <p class="text-gray-300 max-w-2xl mx-auto">
        Temukan keindahan sejarah, keasrian alam, dan tempat rekreasi terbaik di
        Kota Medan.
      </p>
    </section>

    <!-- FILTER & SEARCH BAR -->
    <section class="max-w-7xl mx-auto px-6 pt-8 pb-4">
      <div
        class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border"
      >
        <!-- Search Input -->
        <div class="w-full md:w-1/3">
          <input
            type="text"
            id="searchInput"
            placeholder="Cari destinasi wisata..."
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1b3e2b]"
          />
        </div>
        <!-- Filter Buttons -->
        <div class="flex flex-wrap gap-2 w-full md:w-auto justify-center">
          <button
            onclick="filterCategory('All')"
            class="filter-btn active bg-[#1b3e2b] text-white px-4 py-2 rounded-lg text-sm font-medium transition"
          >
            Semua
          </button>
          <button
            onclick="filterCategory('Wisata Sejarah')"
            class="filter-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition"
          >
            Wisata Sejarah
          </button>
          <button
            onclick="filterCategory('Wisata Alam')"
            class="filter-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition"
          >
            Wisata Alam
          </button>
          <button
            onclick="filterCategory('Rekreasi')"
            class="filter-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition"
          >
            Rekreasi
          </button>
        </div>
      </div>
    </section>

    <!-- DESTINATION GRID -->
    <section class="max-w-7xl mx-auto px-6 py-8">
      <div
        id="destinationGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      ></div>
      <p id="destEmpty" class="hidden py-16 text-center text-gray-500">
        Tidak ada destinasi yang cocok dengan pencarianmu.
      </p>
    </section>

    <!-- FOOTER -->
    <footer class="dark-zone bg-green-950 text-amber-50/85">
      <div class="pucuk rotate-180"></div>
      <div
        class="mx-auto flex w-full max-w-7xl flex-wrap items-center justify-between gap-4 px-6 py-10"
      >
        <p class="font-display text-xl font-bold text-yellow-500">
          Medan Explore
        </p>
        <p class="text-sm">© 2026 Medan Explore</p>
      </div>
    </footer>

    <script src="./js/main.js"></script>

    <!-- FILTER & SEARCH -->
    <script>
      const searchInput = document.getElementById("searchInput");
      const grid = document.getElementById("destinationGrid");
      const emptyEl = document.getElementById("destEmpty");
      const filterBtns = document.querySelectorAll(".filter-btn");

      let currentCategory = "All";
      let appData = null;

      const renderDestCard = (d) => `
        <div class="dest-card flex h-full flex-col bg-white rounded-2xl overflow-hidden shadow-md border hover:shadow-xl hover:-translate-y-1 transition duration-300">
          ${imgTag(d, "w-full h-48 object-cover")}
          <div class="flex flex-1 flex-col p-5">
            <span class="inline-block w-fit bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-semibold mb-2">${escapeHtml(categoryName(appData, d.category_id))}</span>
            <h3 class="text-xl font-bold text-gray-900 mb-1">${escapeHtml(d.name)}</h3>
            <p class="text-xs text-gray-500 mb-3">📍 ${escapeHtml(d.address)}</p>
            <p class="text-gray-600 text-sm mb-4 flex-1">${escapeHtml(d.description)}</p>
            <button type="button" data-detail-id="${d.id}" class="w-full cursor-pointer bg-[#1b3e2b] hover:bg-[#122b1e] text-white py-2 rounded-lg text-sm font-medium transition">Lihat Detail</button>
          </div>
        </div>`;

      function filterCategory(category) {
        currentCategory = category;
        filterBtns.forEach((btn) => {
          const label = btn.textContent.trim();
          const active =
            label === category || (category === "All" && label === "Semua");
          btn.classList.toggle("bg-[#1b3e2b]", active);
          btn.classList.toggle("text-white", active);
          btn.classList.toggle("bg-gray-100", !active);
          btn.classList.toggle("text-gray-700", !active);
        });
        applyFilters();
      }

      function applyFilters() {
        if (!appData) return;
        const term = searchInput.value.trim().toLowerCase();
        const matches = appData.destinations.filter((d) => {
          if (d.category_id === 4) return false; // Kuliner punya halaman sendiri
          const matchesSearch = (d.name + " " + d.address)
            .toLowerCase()
            .includes(term);
          const matchesCategory =
            currentCategory === "All" ||
            categoryName(appData, d.category_id) === currentCategory;
          return matchesSearch && matchesCategory;
        });
        grid.innerHTML = matches.map(renderDestCard).join("");
        emptyEl.classList.toggle("hidden", matches.length > 0);
      }

      searchInput.addEventListener("input", applyFilters);

      loadData()
        .then((data) => {
          appData = data;
          applyFilters();
        })
        .catch((err) => {
          console.error(err);
          emptyEl.textContent = "Data destinasi gagal dimuat.";
          emptyEl.classList.remove("hidden");
        });
    </script>
  </body>
</html>
